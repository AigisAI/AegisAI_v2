name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-expo:
    name: Verify Exhibition Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sites/expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm exec tsc --noEmit
      - run: corepack pnpm build:standalone
      - run: corepack pnpm test
      - run: node tests/standalone-smoke.mjs
      - name: Verify exhibition container builds
        run: docker build -f standalone/Dockerfile -t aegisai-expo-check .
      - name: Verify nginx routing configuration
        run: docker run --rm -v "${{ github.workspace }}/apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

  verify:
    name: Verify Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint workspace
        run: corepack pnpm lint

      - name: Run tests
        run: corepack pnpm test

      - name: Typecheck workspace
        run: corepack pnpm typecheck

      - name: Build workspace
        run: corepack pnpm build
