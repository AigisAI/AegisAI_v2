name: CI

on:
  pull_request:
    branches:
      - dev
      - main
      - feat/340-private-platform-expansion
      - fix/346-private-grafana-auth
      - feat/352-private-kubernetes-admission
      - feat/361-private-api-horizontal-scaling
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegisai_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aegisai_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aegisai_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ontology/requirements.txt

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install ontology dependencies
        run: |
          python -m pip install --only-binary=:all: --requirement ontology/requirements.txt
          python -m pip check

      - name: Validate ontology Compose
        run: |
          NEO4J_PASSWORD="$(openssl rand -hex 32)" \
            docker compose -f ontology/docker-compose.yml config --quiet >/dev/null

      - name: Lint workspace
        run: corepack pnpm lint

      - name: Run tests
        run: corepack pnpm test

      - name: Validate T051-T056 qualification packages
        run: corepack pnpm qualification:validate

      - name: Test ontology importer
        run: python -m unittest discover -s ontology/tests -p 'test_*.py'

      - name: Typecheck workspace
        run: corepack pnpm typecheck

      - name: Build workspace
        run: corepack pnpm build

      - name: Verify API runtime build layout
        run: node --test test/runtime/*.test.mjs

      - name: Validate Prisma schema
        run: corepack pnpm --filter @aegisai/api prisma:validate

      - name: Apply Prisma migrations to a clean database
        run: corepack pnpm --filter @aegisai/api prisma:migrate:deploy

      - name: Probe SAST rollback authority on PostgreSQL
        env:
          RUN_SAST_ROLLBACK_POSTGRES_PROBE: "1"
        run: >-
          corepack pnpm --filter @aegisai/api test --runInBand
          test/rule-governance/sast-rule-bundle-rollback.postgres.e2e-spec.ts

      - name: Check whitespace
        run: git diff --check

  private-profile:
    name: Verify and prepare private EC2 candidate
    needs: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegisai_verify
          POSTGRES_USER: verify
          POSTGRES_PASSWORD: verify-only-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verify -d aegisai_verify"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://verify:verify-only-local@localhost:5432/aegisai_verify
      PERSISTENCE_TEST_DATABASE_URL: postgresql://verify:verify-only-local@localhost:5432/aegisai_verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.9
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - name: Generate both isolated clients and build private API
        run: |
          corepack pnpm --filter @aegisai/api prisma:generate
          corepack pnpm --filter @aegisai/shared build
          corepack pnpm --filter @aegisai/private-api build
      - name: Verify namespace and profile startup guards
        run: node --test test/private-runtime/*.test.mjs
      - name: Apply only private migrations to private verification DB
        run: corepack pnpm --filter @aegisai/private-api prisma:migrate:deploy
      - name: Verify private SQL lifecycle and result boundaries
        run: node --test --test-concurrency=1 test/private-persistence/*.test.mjs
      - name: Verify operator maintenance safety
        run: |
          sudo python3 -E -s -B deploy/aws-ec2/test_managed_runtime.py
          python3 tools/private-runtime/test_candidate.py
          sh -n tools/private-runtime/deploy-prepared.sh
          sh -n deploy/aws-ec2/deploy-candidate.sh
      - name: Build trusted native verification image
        run: docker build --target builder -f apps/private-api/Dockerfile -t aegisai-private-verify:ci .
      - name: Verify native channel roles without runtime secrets
        run: |
          docker run --rm --user 0 --network host --memory 768m --cpus 1 --pids-limit 128 \
            -e NODE_ENV=production \
            -e PERSISTENCE_TEST_DATABASE_URL=postgresql://verify:verify-only-local@127.0.0.1:5432/aegisai_verify \
            -v "$PWD/test/private-worker-native:/app/test/private-worker-native:ro" \
            aegisai-private-verify:ci node --test --test-concurrency=1 /app/test/private-worker-native/*.test.mjs
      - name: Verify actual non-root read-only catalog mounts
        run: sudo --preserve-env=GITHUB_ACTIONS python3 tools/private-runtime/test_readonly_catalog.py
      - name: Verify actual shared throttle, expiry and store failure across two HTTP apps
        run: sudo --preserve-env=GITHUB_ACTIONS python3 tools/private-runtime/test_distributed_throttle.py
      - name: Verify image policy and install checksum-pinned security tools
        run: |
          python3 deploy/aws-ec2/supply-chain/test_policy.py
          sudo python3 -E -s -B deploy/aws-ec2/supply-chain/install_tools.py --ci
          python3 -c "import sys;sys.path.insert(0,'deploy/aws-ec2/supply-chain');from verify_candidate import gh_binary;gh_binary();print('TRUSTED_TOOL_PERMISSIONS_PASSED')"
      - name: Build immutable private runtime images
        run: |
          docker build -f apps/private-api/Dockerfile --label org.opencontainers.image.revision=$GITHUB_SHA -t aegisai-private-api:ci .
          docker build -f apps/private-web/Dockerfile --label org.opencontainers.image.revision=$GITHUB_SHA -t aegisai-private-web:ci .
      - name: Verify production image private database CLI
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://verify:verify-only-local@127.0.0.1:5432/aegisai_verify \
            aegisai-private-api:ci corepack pnpm --filter @aegisai/private-api prisma:migrate:deploy
      - name: Package validated candidate without deployment
        run: python3 tools/private-runtime/build-candidate.py "$RUNNER_TEMP/private-ec2-candidate"
      - name: Attest candidate and image build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            ${{ runner.temp }}/private-ec2-candidate/candidate.json
            ${{ runner.temp }}/private-ec2-candidate/api-image.tar.gz
            ${{ runner.temp }}/private-ec2-candidate/web-image.tar.gz
      - name: Attest API image SBOM
        id: api-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/private-ec2-candidate/api-image.tar.gz
          sbom-path: ${{ runner.temp }}/private-ec2-candidate/api-sbom.cdx.json
      - name: Attest web image SBOM
        id: web-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/private-ec2-candidate/web-image.tar.gz
          sbom-path: ${{ runner.temp }}/private-ec2-candidate/web-sbom.cdx.json
      - name: Verify real signatures and reject invalid candidates without deployment
        run: |
          cp '${{ steps.provenance.outputs.bundle-path }}' "$RUNNER_TEMP/private-ec2-candidate/provenance.sigstore.json"
          cp '${{ steps.api-sbom.outputs.bundle-path }}' "$RUNNER_TEMP/private-ec2-candidate/api-sbom.sigstore.json"
          cp '${{ steps.web-sbom.outputs.bundle-path }}' "$RUNNER_TEMP/private-ec2-candidate/web-sbom.sigstore.json"
          python3 deploy/aws-ec2/supply-chain/test_signed_candidate.py "$RUNNER_TEMP/private-ec2-candidate"
      - name: Signature failure detail
        if: failure()
        run: cat "$RUNNER_TEMP/verification-cache/last-verification-error.txt" 2>/dev/null || true
      - name: Preserve rejected image reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blocked-image-reports-${{ github.sha }}
          path: |
            ${{ runner.temp }}/private-ec2-candidate/*-vuln.json
            ${{ runner.temp }}/private-ec2-candidate/*-sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve signed security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-image-security-${{ github.sha }}
          path: |
            ${{ runner.temp }}/private-ec2-candidate/candidate.json
            ${{ runner.temp }}/private-ec2-candidate/security.json
            ${{ runner.temp }}/private-ec2-candidate/*-vuln.json
            ${{ runner.temp }}/private-ec2-candidate/*-sbom.cdx.json
            ${{ runner.temp }}/private-ec2-candidate/*.sigstore.json
          retention-days: 90
      - name: Preserve prepared artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-ec2-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/private-ec2-candidate
          retention-days: 3
