name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegisai_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aegisai_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aegisai_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ontology/requirements.txt

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install ontology dependencies
        run: |
          python -m pip install --only-binary=:all: --requirement ontology/requirements.txt
          python -m pip check

      - name: Validate ontology Compose
        run: |
          NEO4J_PASSWORD="$(openssl rand -hex 32)" \
            docker compose -f ontology/docker-compose.yml config --quiet >/dev/null

      - name: Lint workspace
        run: corepack pnpm lint

      - name: Run tests
        run: corepack pnpm test

      - name: Validate T051-T054 qualification packages
        run: corepack pnpm qualification:validate

      - name: Test ontology importer
        run: python -m unittest discover -s ontology/tests -p 'test_*.py'

      - name: Typecheck workspace
        run: corepack pnpm typecheck

      - name: Build workspace
        run: corepack pnpm build

      - name: Verify API runtime build layout
        run: node --test test/runtime/*.test.mjs

      - name: Validate Prisma schema
        run: corepack pnpm --filter @aegisai/api prisma:validate

      - name: Apply Prisma migrations to a clean database
        run: corepack pnpm --filter @aegisai/api prisma:migrate:deploy

      - name: Probe SAST rollback authority on PostgreSQL
        env:
          RUN_SAST_ROLLBACK_POSTGRES_PROBE: "1"
        run: >-
          corepack pnpm --filter @aegisai/api test --runInBand
          test/rule-governance/sast-rule-bundle-rollback.postgres.e2e-spec.ts

      - name: Check whitespace
        run: git diff --check
