services:
  neo4j:
    image: neo4j:5-community
    container_name: aegis-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/aegisai123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - ./data:/data
      - ./logs:/logs
    restart: unless-stopped
