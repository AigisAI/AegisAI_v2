global:
  scrape_interval: 30s
  scrape_timeout: 5s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: aegisai-host
    static_configs:
      - targets: ['172.29.240.1:9464']
  - job_name: aegisai-api
    static_configs:
      - targets: ['api:9465']
