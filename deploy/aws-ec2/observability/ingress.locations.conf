  # Insert into the existing server block; keep other API and /ops denials.
  location = /_grafana_auth {
    internal;
    proxy_pass $application/api/runtime/observability-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
  location = /ops/grafana { return 302 /ops/grafana/; }
  location ^~ /ops/grafana/ {
    auth_request /_grafana_auth;
    auth_request_set $grafana_user $upstream_http_x_aegisai_user;
    auth_request_set $grafana_role $upstream_http_x_aegisai_role;
    error_page 401 =302 /api/auth/github;
    set $grafana http://aegisai-observability-grafana-1:3000;
    proxy_pass $grafana$request_uri;
    proxy_set_header X-WEBAUTH-USER $grafana_user;
    proxy_set_header X-WEBAUTH-ROLE $grafana_role;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Grafana's bootstrap uses inline scripts. Scope this policy to Grafana only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://aegisai-aws.tailaca7d2.ts.net; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }
