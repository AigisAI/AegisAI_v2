stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
backend_scheduler:
  local_work_path: /var/tempo/scheduler
backend_worker:
  compaction:
    block_retention: 24h
overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 262144
      burst_size_bytes: 524288
    global:
      max_bytes_per_trace: 262144
usage_report:
  reporting_enabled: false
