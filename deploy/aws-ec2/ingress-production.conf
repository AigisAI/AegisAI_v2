server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=5s ipv6=off;
  access_log off;
  error_log /dev/null crit;
  client_max_body_size 16k;

  add_header Cache-Control "no-store" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

  set $application http://aegisai-ec2-demo-web-1:80;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_http_version 1.1;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;

  location ~ ^/api/auth/(github|github/callback|me|logout)$ {
    proxy_pass $application$request_uri;
  }
  location ~ ^/api/runtime/(status|repositories|scans|scans/scan_request_[A-Za-z0-9-]+(/evidence)?)$ {
    proxy_pass $application$request_uri;
  }
  location = /api/health {
    proxy_pass $application$request_uri;
  }
  # Legacy fixture, upload, token and integration-management APIs stay closed.
  location /api/ { return 404; }
  location /ops/ { return 404; }
  location = /auth-check { return 302 /; }
  location = /healthz {
    default_type application/json;
    return 200 '{"privateIngress":"enabled","scope":"single-owner-java","ai":"DISABLED"}\n';
  }
  location / {
    proxy_pass $application$request_uri;
  }
}
