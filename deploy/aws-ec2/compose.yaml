name: aegisai-ec2-demo

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegisai
      POSTGRES_USER: aegisai
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: /run/aegisai-runtime-secrets/postgres-password
        target: /run/secrets/postgres-password
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aegisai -d aegisai"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  api:
    image: aegisai-api:${RELEASE_ID:?required}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:?required}
    volumes:
      - type: bind
        source: /opt/aegisai/scanner/catalog
        target: /run/aegisai-runtime
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging

  web:
    image: aegisai-web:${RELEASE_ID:?required}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_PRODUCTION_RUNTIME: "true"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

volumes:
  postgres-data:
  redis-data:
