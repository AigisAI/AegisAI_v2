pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr crit;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map $http_x_forwarded_proto $aegisai_forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $aegisai_forwarded_proto;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location /api/ { proxy_pass http://api:3000; proxy_http_version 1.1; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
