apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  clusterIP: 10.45.0.30
  selector:
    app.kubernetes.io/name: aegisai-private
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: 3000, targetPort: http}
    - {name: metrics, port: 9465, targetPort: metrics}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: ClusterIP
  clusterIP: 10.45.0.40
  selector:
    app.kubernetes.io/name: aegisai-private
    app.kubernetes.io/component: web
  ports:
    - {name: http, port: 80, targetPort: http}
{{- range $external := list (dict "name" "postgres" "ip" "10.45.0.41" "port" 5432) (dict "name" "redis" "ip" "10.45.0.42" "port" 6379) (dict "name" "alloy" "ip" "10.45.0.43" "port" 4318) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $external.name }}
spec:
  type: ClusterIP
  clusterIP: {{ $external.ip }}
  ports:
    - {name: tcp, port: {{ $external.port }}, targetPort: {{ $external.port }}}
{{- end }}
