server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=5s ipv6=off;
  location /api/auth/ {
    access_log off;
    error_log /dev/null crit;
    set $auth_web http://aegisai-ec2-demo-web-1:80;
    proxy_pass $auth_web$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /auth-check {
    access_log off;
    default_type text/html;
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    return 200 '<!doctype html><html lang="ko"><meta name="viewport" content="width=device-width"><title>AegisAI 로그인 연결 확인</title><body style="font:18px sans-serif;max-width:40rem;margin:3rem auto;padding:1rem"><h1>GitHub 로그인 연결 확인</h1><p id="status">로그인 상태를 확인하고 있습니다.</p><a id="login" href="/api/auth/github">GitHub 로그인</a><script>fetch("/api/auth/me",{credentials:"same-origin",cache:"no-store"}).then(r=>r.json()).then(s=>{document.getElementById("status").textContent=s.authenticated?"로그인이 확인됐습니다. 서비스 준비 검증을 계속하고 있습니다.":"GitHub 로그인 버튼으로 계정 연결을 확인해 주세요.";if(s.authenticated)document.getElementById("login").hidden=true;}).catch(()=>{document.getElementById("status").textContent="상태를 확인하지 못했습니다. 잠시 뒤 새로고침해 주세요.";});</script></body></html>';
  }
  location = /healthz {
    default_type application/json;
    return 200 '{"infrastructure":"up","applicationReady":false}\n';
  }
  location / {
    default_type text/plain;
    add_header Retry-After 3600 always;
    return 503 'AegisAI is being prepared for production. Service access is not enabled yet.\n';
  }
}
