map $http_x_forwarded_proto $aegisai_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

log_format aegisai_api escape=json '{"method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $aegisai_forwarded_proto;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ^~ /api/auth/ {
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
  }

  location /api/ {
    access_log /var/log/nginx/access.log aegisai_api;
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
